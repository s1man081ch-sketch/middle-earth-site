<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Средиземье | Middle-earth</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        .banner {
            width: 100%;
            height: 400px;
            background-image: url('banner.jpg');
            background-size: cover;
            background-position: center;
            border-bottom: 4px solid #d4af37;
            position: relative;
        }
        .banner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; top: 0;
            background: linear-gradient(to top, #1a1a1a 0%, transparent 100%);
        }
        .logo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #d4af37;
            margin-top: -90px;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            background-color: #1a1a1a;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #d4af37;
            font-size: 2.5em;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #cccccc;
        }
        .buttons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 15px 30px;
            font-size: 1.2em;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-download {
            background-color: #d4af37;
            color: #1a1a1a;
        }
        .btn-download:hover {
            background-color: #fce28b;
            transform: scale(1.05);
        }
        .btn-discord {
            background-color: #5865F2;
            color: white;
        }
        .btn-discord:hover {
            background-color: #4752c4;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 60px;
            padding: 20px;
            font-size: 0.9em;
            color: #666;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <div class="banner"></div>
    
    <div class="container">
        <img src="logo.png" alt="Логотип" class="logo">
        
        <h1>Средиземье</h1>
        
        <p>Добро пожаловать в мир, основанный на легендах Толкина. Выбери свою расу, вступи в фракцию и напиши свою историю в Minecraft.</p>
        <p><i>Наш сервер работает на базе мода Middle-earth (1.21.8).</i></p>

        <div class="buttons">
            <!-- ЗАМЕНИТЕ ССЫЛКУ НИЖЕ НА ССЫЛКУ ВАШЕГО ЛАУНЧЕРА -->
            <a href="https://discord.gg/qJqMGKhY97" class="btn btn-download">⬇️ Скачать лаунчер</a>
            
            <!-- ЗАМЕНИТЕ ССЫЛКУ НИЖЕ НА ССЫЛКУ ВАШЕГО ДИСКОРДА -->
            <a href="https://discord.gg/qJqMGKhY97" class="btn btn-discord">💬 Наш Discord</a>
        </div>
    </div>

    <div class="footer">
        © 2026 Средиземье | Minecraft Server. Все права защищены.
    </div>

</body>
</html>
